name: Build & Publish Solo Leveler Android Release

on:
  push:
    tags:
      - "v*.*.*"
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag wersji (np. v1.2.0)"
        required: true
        default: "v1.2.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK & Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Install Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Typecheck Idle RPG V2
        run: npm run typecheck:idle-rpg

      - name: Validate Idle RPG Assets
        run: npm run validate:idle-rpg-assets

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradlew Executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Prepare Release APK Artifact
        id: prepare_apk
        run: |
          TAG_NAME="${{ github.ref_name || inputs.release_tag }}"
          CLEAN_TAG="${TAG_NAME#v}"
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/solo-leveler-${TAG_NAME}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "release-artifacts/solo-leveler.apk"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "clean_tag=${CLEAN_TAG}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag_name }}
          name: Solo Leveler ${{ steps.prepare_apk.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-artifacts/solo-leveler-${{ steps.prepare_apk.outputs.tag_name }}.apk
            release-artifacts/solo-leveler.apk
            server/update-manifest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
