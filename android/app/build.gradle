apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

android {
    namespace = "com.damia.sololeveler"
    compileSdk = rootProject.ext.compileSdkVersion
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId "com.damia.sololeveler.v2"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    sourceSets {
        main {
            jniLibs.srcDirs += ["$buildDir/generated/libgdxNatives"]
            assets.srcDirs += ["$buildDir/generated/nativeGameAssets"]
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

configurations {
    natives
}

def nativeGameAssets = [
    [source: file("../../src/assets/backgrounds/mini-games/01-solo-gate-purple.jpg"), output: "shadow-extraction-bg.jpg"],
    [source: file("../../src/assets/models/monster-abyss-mage-wraith.png"), output: "shadow-wraith.png"],
    [source: file("../../src/assets/models/monster-shadow-spike-wolf.png"), output: "shadow-decoy.png"],
    [source: file("../../src/assets/models/relic-monarch-heart.png"), output: "heart-relic.png"],
    [source: file("../../src/assets/fonts/orbitron/Orbitron-wght.ttf"), output: "Orbitron-wght.ttf"]
]

tasks.register('copyLibgdxNatives') {
    def outputDir = file("$buildDir/generated/libgdxNatives")
    outputs.dir(outputDir)
    doLast {
        delete(outputDir)
        configurations.natives.files.each { jarFile ->
            def abi = null
            if (jarFile.name.endsWith('natives-armeabi-v7a.jar')) abi = 'armeabi-v7a'
            if (jarFile.name.endsWith('natives-arm64-v8a.jar')) abi = 'arm64-v8a'
            if (jarFile.name.endsWith('natives-x86.jar')) abi = 'x86'
            if (jarFile.name.endsWith('natives-x86_64.jar')) abi = 'x86_64'
            if (abi != null) {
                copy {
                    from(zipTree(jarFile))
                    into("$outputDir/$abi")
                    include('*.so')
                }
            }
        }
    }
}

tasks.register('copyNativeGameAssets') {
    def outputDir = file("$buildDir/generated/nativeGameAssets/native-game")
    inputs.files(nativeGameAssets.collect { it.source })
    outputs.dir(outputDir)
    doLast {
        def missing = nativeGameAssets.findAll { !it.source.exists() }
        if (!missing.isEmpty()) {
            throw new GradleException("Missing native game assets: " + missing.collect { it.source }.join(", "))
        }
        delete(outputDir)
        nativeGameAssets.each { asset ->
            copy {
                from(asset.source)
                into(outputDir)
                rename { asset.output }
            }
        }
        def unpackedMissing = nativeGameAssets.findAll { !file("$outputDir/${it.output}").exists() }
        if (!unpackedMissing.isEmpty()) {
            throw new GradleException("Native game assets were not copied: " + unpackedMissing.collect { it.output }.join(", "))
        }
    }
}

preBuild.dependsOn(copyLibgdxNatives, copyNativeGameAssets)

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.health.connect:connect-client:$healthConnectVersion"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutinesAndroidVersion"
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-freetype-platform:$gdxVersion:natives-x86_64"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
